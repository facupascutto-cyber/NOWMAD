<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 380 395" overflow="visible"><style>@keyframes nm-bob { 
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(1.03, 0.97); }
}@keyframes nm-wob { 
  0%, 100% { transform: rotate(-11deg); }
  50% { transform: rotate(11deg); }
}@keyframes nm-tilt { 
  0%, 100% { transform: rotate(20deg); }
  50% { transform: rotate(28deg); }
}@keyframes nm-spin { 
  100% { transform: rotate(360deg); }
}@keyframes nm-snap { 
  0%, 62%, 100% { transform: rotate(0deg); }
  70% { transform: rotate(-16deg); }
  80% { transform: rotate(9deg); }
  90% { transform: rotate(-3deg); }
}@keyframes nm-wave { 
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-16deg); }
}@keyframes nm-twinkle { 
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.25; transform: scale(0.55); }
}@keyframes nm-jitter { 
  0% { transform: translate(0px, 0px); }
  25% { transform: translate(-5px, 1px) rotate(-1.5deg); }
  50% { transform: translate(4px, -1px) rotate(1deg); }
  75% { transform: translate(-2px, 0px); }
  100% { transform: translate(0px, 0px); }
}@keyframes nm-burst { 
  100% { transform: rotate(360deg); }
}@keyframes nm-pop { 
  0% { opacity: 0; transform: scale(0.6) translateY(30px); }
  100% { opacity: 1; transform: none; }
}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
